<!doctype html>

<body>

        <rect x="3" y="3" width="18" height="18" rx="2.5"></rect>
        <path d="M6.5 7.5h5v5h-5zM13.5 7.5h4M13.5 10h4M6.5 16h11"></path>

      </svg>
